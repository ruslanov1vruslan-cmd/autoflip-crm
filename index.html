<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AutoFlip CRM</title>

<link rel="manifest" href="manifest.webmanifest">


<style>

* {
    box-sizing:border-box;
}

body {

    margin:0;
    background:#f7f7f7;
    color:#222;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

}


.header {

    padding:24px;

    display:flex;

    justify-content:space-between;

    align-items:center;

}


.logo {

    font-size:26px;

    font-weight:700;

}



.icons {

    font-size:20px;

}



.container {

    padding:0 20px 100px;

}



.card {

    background:white;

    border-radius:24px;

    padding:22px;

    margin-bottom:16px;

    box-shadow:
    0 8px 30px rgba(0,0,0,0.06);

}



.main-card {

    background:#222;

    color:white;

}



.label {

    color:#717171;

    font-size:14px;

}


.main-card .label {

    color:#ddd;

}



.big-number {

    font-size:34px;

    font-weight:700;

    margin-top:8px;

}



.stats {

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:15px;

}



.stat-number {

    font-size:26px;

    font-weight:700;

    margin-top:8px;

}



.car-card {


    border-radius:24px;

    padding:22px;

    background:white;

    margin-bottom:15px;

    box-shadow:
    0 8px 25px rgba(0,0,0,0.05);

}



.status {


    display:inline-block;

    padding:7px 14px;

    border-radius:20px;

    font-size:13px;

    font-weight:600;

}



.sale {

    background:#dcfce7;

    color:#15803d;

}


.prepare {

    background:#ffedd5;

    color:#c2410c;

}



.buy {

    background:#dbeafe;

    color:#1d4ed8;

}



.profit {

    color:#16a34a;

    font-size:22px;

    font-weight:700;

}



.button {


    background:#ff385c;

    color:white;

    padding:17px;

    text-align:center;

    border-radius:18px;

    font-weight:600;

    margin-top:20px;

}



.bottom {


    position:fixed;

    bottom:0;

    left:0;

    right:0;


    height:80px;

    background:white;

    display:flex;

    justify-content:space-around;

    align-items:center;


    border-top:1px solid #eee;


}



.menu-item {

    text-align:center;

    color:#717171;

    font-size:12px;

}



.menu-item span {

    display:block;

    font-size:24px;

    margin-bottom:3px;

}



.active {

    color:#ff385c;

}


</style>


</head>



<body>


<div class="header">


<div class="logo">

AutoFlip CRM

</div>


<div class="icons">

🔔 ⚙️

</div>


</div>



<div class="container">


<div class="card main-card">


<div class="label">

Деньги в автомобилях

</div>


<div class="big-number">

0 ₽

</div>


</div>




<div class="stats">


<div class="card">

<div class="label">

Автомобили

</div>


<div class="stat-number">

0

</div>


</div>



<div class="card">


<div class="label">

Прибыль

</div>


<div class="stat-number">

0 ₽

</div>


</div>


</div>




<div class="card">


<div class="label">

Последние автомобили

</div>


<br>


<div class="car-card">


<b>BMW X5 G05</b>


<br><br>


<span class="status sale">

🟢 В продаже

</span>


<br><br>


<div>

Себестоимость:

<br>

3 120 000 ₽

</div>


<br>


<div class="profit">

+380 000 ₽

</div>


</div>




<div class="car-card">


<b>Toyota Camry</b>


<br><br>


<span class="status prepare">

🔧 Подготовка

</span>


</div>



</div>




<div class="button">

➕ Новая сделка

</div>



</div>





<div class="bottom">


<div class="menu-item active">

<span>🏠</span>

Главная

</div>


<div class="menu-item">

<span>🚗</span>

Авто

</div>


<div class="menu-item">

<span>➕</span>

Сделка

</div>


<div class="menu-item">

<span>👥</span>

Клиенты

</div>


<div class="menu-item">

<span>📊</span>

Финансы

</div>


</div>


</body>

</html>
