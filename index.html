<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoFlip CRM</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f7f7f7;
    color: #222;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

.header {
    padding: 24px 24px 16px 72px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 26px;
    font-weight: 700;
}

.icons {
    font-size: 22px;
}

.container {
    padding: 0 20px 100px;
}

.card {
    background: white;
    border-radius: 24px;
    padding: 22px;
    margin-bottom: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.06);
}

.main-card {
    background: #222;
    color: white;
}

.label {
    color: #777;
    font-size: 14px;
}

.main-card .label {
    color: #ddd;
}

.big-number {
    font-size: 34px;
    font-weight: 700;
    margin-top: 8px;
}

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.input {
    width: 100%;
    padding: 15px;
    margin-bottom: 12px;
    border-radius: 16px;
    border: 1px solid #eee;
    font-size: 16px;
    background: #fafafa;
}

.car-card {
    background: white;
    border-radius: 24px;
    padding: 22px;
    margin-bottom: 15px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.05);
}

.status {
    display: inline-block;
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
}

.sale {
    background: #dcfce7;
    color: #15803d;
}

.prepare {
    background: #ffedd5;
    color: #c2410c;
}

.buy {
    background: #dbeafe;
    color: #1d4ed8;
}

.profit {
    color: #16a34a;
    font-size: 22px;
    font-weight: 700;
}

.button {
    background: #ff385c;
    color: white;
    padding: 17px;
    text-align: center;
    border-radius: 18px;
    font-weight: 600;
    margin-top: 20px;
    cursor: pointer;
}

.filter-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 10px;
}

.filter-row button {
    border: none;
    background: #f1f1f1;
    padding: 10px 15px;
    border-radius: 20px;
    white-space: nowrap;
    font-size: 14px;
    cursor: pointer;
}

.bottom {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 80px;
    background: white;
    display: flex;
    justify-content: space-around;
    align-items: center;
    border-top: 1px solid #eee;
}

.menu-item {
    text-align: center;
    color: #717171;
    font-size: 12px;
    cursor: pointer;
}

.menu-item span {
    display: block;
    font-size: 24px;
    margin-bottom: 3px;
}

.active {
    color: #ff385c;
}

.back-btn {
    position: fixed;
    top: 18px;
    left: 18px;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.96);
    border: 1px solid rgba(0,0,0,0.06);
    border-radius: 14px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    z-index: 9999;
    cursor: pointer;
    font-size: 18px;
    font-weight: 700;
    user-select: none;
}

.back-btn:active {
    transform: scale(0.98);
}
</style>
</head>

<body>

<div class="back-btn" onclick="goBack()" title="Назад">←</div>

<div class="header">
    <div class="logo">AutoFlip CRM</div>
    <div class="icons">🔔 ⚙️</div>
</div>

<div class="container" id="app"></div>

<div class="bottom">
    <div class="menu-item active" onclick="loadHome()">
        <span>🏠</span>
        Главная
    </div>

    <div class="menu-item" onclick="showCars()">
        <span>🚗</span>
        Авто
    </div>

    <div class="menu-item" onclick="openNewDeal()">
        <span>➕</span>
        Сделка
    </div>

    <div class="menu-item">
        <span>👥</span>
        Клиенты
    </div>

    <div class="menu-item" onclick="showFinance()">
        <span>📊</span>
        Финансы
    </div>
</div>

<script>
window.__screenHistory = [];
window.__restoringScreen = false;

(function () {
    const app = document.getElementById("app");
    const descriptor = Object.getOwnPropertyDescriptor(Element.prototype, "innerHTML");

    Object.defineProperty(app, "innerHTML", {
        configurable: true,
        get() {
            return descriptor.get.call(this);
        },
        set(value) {
            if (!window.__restoringScreen) {
                const current = descriptor.get.call(this);
                if (current && current !== value) {
                    window.__screenHistory.push(current);
                }
            }
            descriptor.set.call(this, value);
        }
    });
})();

function goBack() {
    const app = document.getElementById("app");

    if (!window.__screenHistory || window.__screenHistory.length === 0) {
        loadHome();
        return;
    }

    window.__restoringScreen = true;
    app.innerHTML = window.__screenHistory.pop();
    window.__restoringScreen = false;
}
</script>

<script src="js/database.js"></script>
<script src="js/status.js"></script>
<script src="js/analytics.js"></script>
<script src="js/cars.js"></script>
<script src="js/deals.js"></script>
<script src="js/car-card.js"></script>
<script src="js/expenses.js"></script>
<script src="js/sales.js"></script>
<script src="js/investors.js"></script>
<script src="js/finance.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>

<script>
loadHome();
</script>

</body>
</html>
