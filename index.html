<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AutoFlip CRM</title>

<link rel="manifest" href="manifest.webmanifest">

<style>
body {
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#f8fafc;
    color:#0f172a;
}

.header {
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo {
    font-size:22px;
    font-weight:700;
}

.icons {
    font-size:20px;
}

.container {
    padding:0 20px 90px;
}

.card {
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.06);
}

.big-number {
    font-size:32px;
    font-weight:700;
    margin-top:10px;
}

.stats {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.button {
    background:#2563eb;
    color:white;
    text-align:center;
    padding:16px;
    border-radius:15px;
    font-weight:600;
    margin-top:20px;
}

.bottom {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:70px;
    background:white;
    border-top:1px solid #e5e7eb;
    display:flex;
    justify-content:space-around;
    align-items:center;
}

.menu-item {
    text-align:center;
    font-size:13px;
}

.menu-item span {
    display:block;
    font-size:22px;
}

</style>

</head>
 
<body>

<div class="header">

<div class="logo">
AutoFlip CRM
</div>

<div class="icons">
🔔 ⚙️
</div>

</div>


<div class="container" id="app">


<div class="card">

<div>
💰 Деньги в автомобилях
</div>

<div class="big-number">
0 ₽
</div>

</div>



<div class="stats">

<div class="card">

🚗 Автомобили

<div class="big-number">
0
</div>

</div>


<div class="card">

📈 Прибыль

<div class="big-number">
0 ₽
</div>

</div>

</div>



<div class="card">

Последние действия

<p>
Нет данных
</p>

</div>



<div class="button">

➕ Новая сделка

</div>



</div>



<div class="bottom">


<div class="menu-item">
<span>🏠</span>
Главная
</div>


<div class="menu-item">
<span>🚗</span>
Авто
</div>


<div class="menu-item">
<span>➕</span>
Сделка
</div>


<div class="menu-item">
<span>👥</span>
Клиенты
</div>


<div class="menu-item">
<span>📊</span>
Финансы
</div>


</div>
<script src="js/database.js"></script>
<script src="js/app.js"></script>

<script>
loadHome();
</script>

</body>
</html>
